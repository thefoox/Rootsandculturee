<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roots & Culture — Nettsiden oppdateres</title>
  <style>
    :root {
      --green-900: #1a2e1a;
      --green-800: #2d4a2d;
      --rust: #a0522d;
      --text: #2c2c2c;
      --text-light: #666;
      --text-muted: #999;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    .logo {
      width: 220px;
      height: auto;
      margin: 0 auto 2.5rem;
      display: block;
    }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
      color: var(--green-900);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--rust);
      margin: 1.5rem auto;
      border-radius: 1px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-light);
      margin-bottom: 1rem;
      font-weight: 300;
    }

    p.detail {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    /* Animated dots */
    .progress {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 2rem 0 1rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rust);
      opacity: 0.3;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
    }

    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: system-ui, -apple-system, sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0.6; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      p { font-size: 1rem; }
      .logo { width: 160px; }
      .container { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="file:///home/william/Documents/Rootsnew/public/logo_black.png" alt="Roots & Culture" class="logo">

    <h1>Nettsiden oppdateres</h1>

    <div class="divider"></div>

    <p>
      Vi jobber med å forbedre opplevelsen for deg.
      Nettsiden er snart tilbake.
    </p>

    <div class="progress">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <p class="detail">
      Takk for tålmodigheten
    </p>
  </div>

  <div class="footer">
    <span class="brand">Roots & Culture</span>
  </div>

</body>
</html>
