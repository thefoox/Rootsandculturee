<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roots & Culture — Nettsiden oppdateres</title>
  <style>
    :root {
      --green-900: #1a2e1a;
      --green-800: #2d4a2d;
      --green-700: #3d6b3d;
      --green-600: #4a7c4a;
      --rust: #a0522d;
      --rust-light: #c4724a;
      --burnt-orange: #cc6633;
      --warm-brown: #8b6914;
      --cream: #faf6f0;
      --cream-dim: #f0ebe3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--green-900);
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--cream);
      overflow: hidden;
      position: relative;
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(160, 82, 45, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(45, 74, 45, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(204, 102, 51, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    /* Leaf decoration */
    .leaf-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      opacity: 0.85;
    }

    .leaf-icon svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
      color: var(--cream);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--rust);
      margin: 1.5rem auto;
      border-radius: 1px;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--cream-dim);
      margin-bottom: 1rem;
      font-weight: 300;
    }

    p.detail {
      font-size: 0.95rem;
      color: rgba(250, 246, 240, 0.55);
      margin-top: 1.5rem;
    }

    /* Animated dots */
    .progress {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 2rem 0 1rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rust);
      opacity: 0.3;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
    }

    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(250, 246, 240, 0.3);
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Floating leaves animation */
    .floating-leaf {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translateY(-20px) rotate(0deg) translateX(0);
      }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(360deg) translateX(80px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0.6; }
      .floating-leaf { animation: none; display: none; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      p { font-size: 1rem; }
      .container { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="leaf-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8C32 8 16 20 16 36C16 44.8 23.2 52 32 52C40.8 52 48 44.8 48 36C48 20 32 8 32 8Z"
              fill="none" stroke="rgba(160,82,45,0.6)" stroke-width="1.5"/>
        <path d="M32 18V46" stroke="rgba(160,82,45,0.4)" stroke-width="1"/>
        <path d="M32 28C27 24 22 28 22 28" stroke="rgba(160,82,45,0.3)" stroke-width="1"/>
        <path d="M32 34C37 30 42 34 42 34" stroke="rgba(160,82,45,0.3)" stroke-width="1"/>
      </svg>
    </div>

    <h1>Nettsiden oppdateres</h1>

    <div class="divider"></div>

    <p>
      Vi jobber med a forbedre opplevelsen for deg.
      Nettsiden er snart tilbake.
    </p>

    <div class="progress">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <p class="detail">
      Takk for talmodigheten
    </p>
  </div>

  <div class="footer">
    <span class="brand">Roots & Culture</span>
  </div>

  <script>
    // Floating leaf particles
    (function() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const leafSVG = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 2C8 2 4 5 4 9C4 11.2 5.8 13 8 13C10.2 13 12 11.2 12 9C12 5 8 2 8 2Z"
              fill="rgba(160,82,45,0.4)"/>
      </svg>`;

      function createLeaf() {
        const leaf = document.createElement('div');
        leaf.className = 'floating-leaf';
        leaf.innerHTML = leafSVG;
        leaf.style.left = Math.random() * 100 + 'vw';
        leaf.style.animationDuration = (12 + Math.random() * 10) + 's';
        leaf.style.animationDelay = Math.random() * 8 + 's';
        leaf.style.transform = `scale(${0.5 + Math.random() * 0.8})`;
        document.body.appendChild(leaf);

        leaf.addEventListener('animationiteration', () => {
          leaf.style.left = Math.random() * 100 + 'vw';
        });
      }

      for (let i = 0; i < 6; i++) createLeaf();
    })();
  </script>
</body>
</html>
